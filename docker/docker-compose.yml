services:
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-api:
    # Imagem oficial: devolve QR no connect e no webhook (atendai devolvia só {"count":0})
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      # Para o webhook alcançar o Laravel no host
      - "nexxivo.test:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-sua-chave-aqui}
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      # Versão estável WhatsApp Web (ajuste se o QR não aparecer: 2.2432.5.0 ou 2.3000.1015901307)
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1018917897
      # Webhook global: envia eventos (incl. QR) para o Laravel; URL acessível pelo container
      - WEBHOOK_GLOBAL_ENABLED=true
      # Laravel precisa estar acessível em :8000 para o container. Rode: cd nexxivo && php artisan serve --host=0.0.0.0 --port=8000
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_GLOBAL_URL:-http://host.docker.internal:8000/api/webhooks/evolution}
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD:-evolution}@evolution-postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_nex
      # Redis: sem ele a Evolution fica "redis disconnected" e não envia MESSAGES_UPSERT
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/0
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    tty: true

volumes:
  evolution_store:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:
  ollama_data:
