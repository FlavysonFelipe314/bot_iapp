; Supervisor: worker da fila Laravel (Nexxivo)
; Ver README em deploy/supervisor/README.md

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/cv-389/Sites/sites/sites/nexxivo/artisan queue:work database --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=/home/cv-389/Sites/sites/sites/nexxivo
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=cv-389
numprocs=2
redirect_stderr=true
stdout_logfile=/home/cv-389/Sites/sites/sites/nexxivo/storage/logs/supervisor-worker.log
stopwaitsecs=3600
